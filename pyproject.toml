[project]
name = "newton-mcp-gateway"
version = "0.1.0"
description = "Experimental MCP bridge for Archetype AI Newton, and a closed-loop action runtime proposal for Physical AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
newton-mcp = "newton_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newton_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
