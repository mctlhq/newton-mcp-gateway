# examples/smart-home/runtime.yaml -- the smart-home testbed's allow-list.
#
# Safe demo capabilities only, per the epic's hard rule: no lock, oven, alarm,
# industrial start/stop or safety-system tool belongs in this file, ever. See
# docs/action-runtime.md for the full shape and the filter chain this feeds.
#
# This is discovery + resolution only. Nothing here executes a tool.
#
# `alice` stands in for an open-source smart-home MCP server. The URL below
# is a deliberately non-resolvable RFC 2606 placeholder -- no real host is
# named. The in-process fake actuator this testbed drives
# (`examples/smart-home/fake_alice.py::in_process_factory`) ignores this
# declared transport entirely; `ServerConfig.binding_identity` (and so the
# approval binding) is still computed from the *declared* transport below,
# never from how the fake actually connects. See
# `examples/smart-home/README.md` for why a real Alice server is not
# drivable yet.

servers:
  - name: alice
    transport:
      kind: streamable-http
      url: https://alice.invalid/mcp

capabilities:
  - server: alice
    tool: set_ac_temperature
    goal_prefixes: ["reduce_room_temperature", "raise_room_temperature"]
    target:
      type: environment
      locations: ["kitchen"]
    arguments:
      room: "${target.location}"
      target_temperature_c: "${constraints.desired_temperature_c}"
    read_tool: get_room_state
    read_arguments:
      room: "${target.location}"
    idempotent: true

  - server: alice
    tool: set_light_state
    goal_prefixes: ["turn_on_light", "turn_off_light"]
    target:
      type: environment
      locations: ["kitchen"]
    arguments:
      room: "${target.location}"
      "on": "${constraints.desired_on}"
    read_tool: get_room_state
    read_arguments:
      room: "${target.location}"
    idempotent: true

  - server: alice
    tool: set_light_brightness
    goal_prefixes: ["set_light_brightness"]
    target:
      type: environment
      locations: ["kitchen"]
    arguments:
      room: "${target.location}"
      brightness_pct: "${constraints.desired_brightness_pct}"
    read_tool: get_room_state
    read_arguments:
      room: "${target.location}"
    idempotent: true

  - server: alice
    tool: announce
    goal_prefixes: ["announce"]
    target:
      type: environment
      locations: []
    arguments:
      message: "${reason}"
    idempotent: false
