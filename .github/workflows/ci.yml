name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t newton-mcp-gateway:ci .
      - name: Verify the container runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id newton-mcp-gateway:ci -u)"
          echo "container uid: $uid"
          [ "$uid" != "0" ]
      - name: Verify the runtime user cannot write to the app directory
        run: |
          if docker run --rm --entrypoint sh newton-mcp-gateway:ci -c 'touch /app/.venv/.w'; then
            echo "expected touch to fail" >&2
            exit 1
          fi
          owner="$(docker run --rm --entrypoint stat newton-mcp-gateway:ci -c %U /app/.venv)"
          echo "app dir owner: $owner"
          [ "$owner" = "root" ]
      - name: Smoke-check streamable-http listens on /mcp
        run: |
          cid="$(docker run -d -p 8000:8000 newton-mcp-gateway:ci)"
          trap 'docker stop "$cid" >/dev/null' EXIT
          status=""
          for _ in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/mcp || true)"
            if [ -n "$status" ] && [ "$status" != "000" ]; then
              break
            fi
            sleep 1
          done
          echo "got HTTP status: $status"
          [ -n "$status" ] && [ "$status" != "000" ]
